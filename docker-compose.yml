version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: finme_qdrant
    ports:
        - "6333:6333"
    volumes:
        - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped

  neo4j:
    image: neo4j:5.9
    container_name: finme_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/test
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 1G
    profiles:
      - full          # only starts with: docker compose --profile full up
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: finme_timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    profiles:
      - full          # only starts with: docker compose --profile full up
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: finme_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build:
      context: .                        # ← root context so Dockerfile can reach data-pipelines/
      dockerfile: backend/Dockerfile
    container_name: finme_backend
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - ollama
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      COLLECTION_NAME: financial_news
      # Kept for when neo4j/timescaledb are enabled
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/market
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finme_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    profiles:
      - full          # only starts with: docker compose --profile full up
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
  timescaledb_data:
  ollama_data:
